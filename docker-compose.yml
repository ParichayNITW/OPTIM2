version: "3.9"

# ---------------------------------------------------------------------------
# Pipeline Optima™ — local deployment
# ---------------------------------------------------------------------------
# Usage:
#   docker-compose up --build
#
# Services:
#   postgres    — database                    localhost:5432
#   redis       — Celery broker/backend       localhost:6379
#   api         — FastAPI REST API            localhost:8000  (/api/docs)
#   worker      — Celery worker (solver)
#   frontend    — React 18 UI (nginx)         localhost:80
#   streamlit   — legacy UI (unchanged)       localhost:8501
#
# CRITICAL: The OPTIM2 solver files are mounted READ-ONLY.
# None of them are modified by this setup.
# ---------------------------------------------------------------------------

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optima
      POSTGRES_PASSWORD: optima
      POSTGRES_DB: optima
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optima"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://optima:optima@postgres:5432/optima
      REDIS_URL: redis://redis:6379/0
      SOLVER_PATH: /solver
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
    volumes:
      # Mount the solver READ-ONLY — never modified
      - .:/solver:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://optima:optima@postgres:5432/optima
      REDIS_URL: redis://redis:6379/0
      SOLVER_PATH: /solver
    volumes:
      # Mount the solver READ-ONLY — never modified
      - .:/solver:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    # nginx serves React app + proxies /api/ → api:8000 (no CORS issues)

  streamlit:
    image: python:3.11-slim
    working_dir: /app
    command: >
      bash -c "pip install -q streamlit pandas numpy pyomo plotly fpdf2 kaleido
               scipy matplotlib streamlit-agraph numba xlsxwriter openpyxl &&
               streamlit run pipeline_optimization_app.py --server.port 8501 --server.address 0.0.0.0"
    volumes:
      # Mount the OPTIM2 directory READ-ONLY — the app runs from its own files
      - .:/app:ro
    ports:
      - "8501:8501"
    # Streamlit is standalone; it does NOT depend on postgres/redis

volumes:
  postgres_data:
