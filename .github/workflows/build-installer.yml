name: Build Windows Installer

# Triggers:
#   - Every push to the development branch
#   - Manual trigger from GitHub Actions tab (you can click "Run workflow")
on:
  push:
    branches:
      - claude/optim2-file-count-ymv3s0
      - main
      - master
  workflow_dispatch:          # manual trigger button in GitHub UI

jobs:
  build:
    runs-on: windows-latest   # GitHub's Windows Server VM — Python + Node pre-installed

    steps:
      # ----------------------------------------------------------------
      # 1. Get the code
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Set up Python 3.11
      # ----------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------------------
      # 3. Set up Node.js 20
      # ----------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ----------------------------------------------------------------
      # 4. Install Python dependencies + PyInstaller
      # ----------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r desktop_requirements.txt

      # ----------------------------------------------------------------
      # 5. Build React frontend
      # ----------------------------------------------------------------
      - name: Install npm packages
        working-directory: frontend
        run: npm install

      - name: Build React app
        working-directory: frontend
        run: npm run build

      # ----------------------------------------------------------------
      # 6. Bundle with PyInstaller
      # ----------------------------------------------------------------
      - name: Bundle with PyInstaller
        run: pyinstaller pipeline_optima.spec --noconfirm

      # ----------------------------------------------------------------
      # 7. Install Inno Setup (pre-available via chocolatey on windows-latest)
      # ----------------------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # ----------------------------------------------------------------
      # 8. Create the Windows installer
      # ----------------------------------------------------------------
      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      # ----------------------------------------------------------------
      # 9. Upload the installer as a downloadable artifact
      #    Go to: GitHub → Actions tab → this run → Artifacts section
      # ----------------------------------------------------------------
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PipelineOptima-Windows-Installer
          path: dist\installer\PipelineOptima-Setup-*.exe
          retention-days: 90    # keep for 90 days

      # ----------------------------------------------------------------
      # 10. Also upload the raw app folder (useful for testing)
      # ----------------------------------------------------------------
      - name: Upload app bundle (no installer)
        uses: actions/upload-artifact@v4
        with:
          name: PipelineOptima-App-Bundle
          path: dist\pipeline_optima\
          retention-days: 30
